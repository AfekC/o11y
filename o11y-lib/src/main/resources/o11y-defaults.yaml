# o11y library defaults. Loaded by O11yDefaultsEnvironmentPostProcessor as the lowest-precedence
# property source: the app's own application.yaml / env vars override any of these keys.
# (Not named application.yaml: an app's own application.yaml would hide it on the classpath.)
management:
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
#          endpoint: http://localhost:4317 # override it with env MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
          transport: grpc
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Tracing Batch Settings
otel:
  bsp:
    export:
      timeout: 3000        # Max time for a single export (ms)
    schedule:
      delay: 1000           # Interval between two export attempts (ms)
    max:
      queue:
        size: 2048          # Max spans in queue before dropping (default 2048)
      export:
        batch:
          size: 512         # Max spans per batch (default 512)